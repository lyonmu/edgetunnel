<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>登录 EdgeTunnel</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <script src="/login/app.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-copy">
        <p class="eyebrow">Cloudflare Workers native proxy</p>
        <h1>让边缘代理保持简单、可控、可回滚。</h1>
        <p>配置、加密凭据、订阅与连接日志均由当前 Worker 管理，不依赖 Pages 后台或第三方转换服务。</p>
        <ul>
          <li>独立 Worker 数据面</li>
          <li>版本化配置与冲突保护</li>
          <li>HMAC HttpOnly 管理会话</li>
        </ul>
      </section>
      <section class="login-card">
        <div class="brand-mark" aria-hidden="true">ET</div>
        <p class="eyebrow">Administrator</p>
        <h2>登录控制台</h2>
        <p class="help">请输入 Cloudflare Worker Secret 中配置的 ADMIN。</p>
        <form id="login-form">
          <label>管理员密码
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
          </label>
          <button class="button primary wide" type="submit">安全登录</button>
        </form>
        <p id="login-message" class="form-message" role="alert"></p>
      </section>
    </main>
  </body>
</html>
