<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>EdgeTunnel 管理后台</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <link rel="stylesheet" href="/admin/styles.css" />
    <script src="/admin/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Cloudflare Workers</p>
        <h1>EdgeTunnel 控制台</h1>
      </div>
      <div class="topbar-actions">
        <span id="runtime-status" class="status-pill">正在读取配置</span>
        <button id="logout" class="button secondary" type="button">退出登录</button>
      </div>
    </header>

    <main class="dashboard">
      <nav class="sidebar" aria-label="管理模块">
        <a href="#overview">系统状态</a>
        <a href="#inbound">入站与传输</a>
        <a href="#dns">DNS</a>
        <a href="#egress">出站 Profile</a>
        <a href="#routing">路由规则</a>
        <a href="#subscription">订阅与站点</a>
        <a href="#logs">安全日志</a>
      </nav>

      <form id="config-form" class="content">
        <section id="overview" class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Runtime snapshot</p>
              <h2>系统状态</h2>
            </div>
            <button id="reload" class="button secondary" type="button">重新加载</button>
          </div>
          <div class="metric-grid">
            <article class="metric"><span>Schema</span><strong id="schema-version">—</strong></article>
            <article class="metric"><span>Revision</span><strong id="revision">—</strong></article>
            <article class="metric"><span>默认出站</span><strong id="default-profile">—</strong></article>
            <article class="metric"><span>日志级别</span><strong id="log-level">—</strong></article>
          </div>
        </section>

        <section id="inbound" class="panel">
          <div class="section-heading">
            <div><p class="eyebrow">Inbound</p><h2>入站与传输</h2></div>
          </div>
          <div class="form-grid">
            <fieldset>
              <legend>协议</legend>
              <label class="toggle"><input id="inbound-vless" type="checkbox" /> VLESS</label>
              <label class="toggle"><input id="inbound-trojan" type="checkbox" /> Trojan</label>
              <label class="toggle"><input id="inbound-ss" type="checkbox" /> Shadowsocks</label>
              <label>Shadowsocks 加密
                <select id="ss-method">
                  <option value="aes-128-gcm">aes-128-gcm</option>
                  <option value="aes-256-gcm">aes-256-gcm</option>
                </select>
              </label>
            </fieldset>
            <fieldset>
              <legend>传输</legend>
              <label class="toggle"><input id="transport-ws" type="checkbox" /> WebSocket</label>
              <label>WebSocket Path <input id="ws-path" required /></label>
              <label class="toggle"><input id="transport-grpc" type="checkbox" /> gRPC gun</label>
              <label>Service Name <input id="grpc-service" required /></label>
              <label class="toggle"><input id="transport-xhttp" type="checkbox" /> XHTTP stream-one</label>
              <label>XHTTP Path <input id="xhttp-path" required /></label>
            </fieldset>
          </div>
        </section>

        <section id="dns" class="panel">
          <div class="section-heading"><div><p class="eyebrow">Datagram</p><h2>DNS</h2></div></div>
          <div class="form-grid three">
            <label class="toggle"><input id="dns-enabled" type="checkbox" /> 启用 UDP DNS</label>
            <label>DoH URL <input id="doh-url" type="url" required /></label>
            <label>超时（ms）<input id="dns-timeout" type="number" min="100" required /></label>
            <label>最大报文（bytes）<input id="dns-max" type="number" min="512" max="65535" required /></label>
          </div>
        </section>

        <section id="egress" class="panel">
          <div class="section-heading">
            <div><p class="eyebrow">Egress</p><h2>出站 Profile</h2></div>
            <button id="test-profile" class="button secondary" type="button">测试默认出站</button>
          </div>
          <label>Profiles JSON
            <textarea id="profiles" rows="14" spellcheck="false"></textarea>
          </label>
          <div class="credential-box">
            <h3>凭据更新</h3>
            <p class="help">密码留空不会修改；勾选删除会明确移除该凭据。</p>
            <div class="form-grid three">
              <label>Credential Ref <input id="credential-ref" placeholder="proxy-main" /></label>
              <label>Username <input id="credential-user" autocomplete="off" /></label>
              <label>Password <input id="credential-password" type="password" autocomplete="new-password" /></label>
              <label class="toggle danger"><input id="credential-delete" type="checkbox" /> 删除该凭据</label>
            </div>
          </div>
        </section>

        <section id="routing" class="panel">
          <div class="section-heading"><div><p class="eyebrow">Routing</p><h2>路由规则</h2></div></div>
          <div class="form-grid">
            <label>默认 Profile <input id="routing-default" required /></label>
            <label class="toggle"><input id="block-private" type="checkbox" /> 阻止私网、环回与链路本地目标</label>
          </div>
          <label>Rules JSON
            <textarea id="routing-rules" rows="12" spellcheck="false"></textarea>
          </label>
        </section>

        <section id="subscription" class="panel">
          <div class="section-heading"><div><p class="eyebrow">Subscription</p><h2>订阅与站点</h2></div></div>
          <div class="form-grid">
            <label class="toggle"><input id="subscription-enabled" type="checkbox" /> 启用订阅</label>
            <label>公开基础 URL（可选）<input id="subscription-base" type="url" placeholder="https://proxy.example.com" /></label>
            <label>启用格式（JSON 数组）<input id="subscription-formats" spellcheck="false" /></label>
            <label>伪装站 URL（可选）<input id="camouflage-url" type="url" placeholder="https://www.example.com" /></label>
          </div>
          <div class="inline-controls">
            <select id="preview-format">
              <option value="mixed">Mixed</option>
              <option value="base64">Base64</option>
              <option value="clash">Clash / Mihomo</option>
              <option value="singbox">sing-box</option>
              <option value="surge">Surge</option>
            </select>
            <button id="preview" class="button secondary" type="button">生成预览</button>
          </div>
          <pre id="preview-output" class="output">尚未生成</pre>
        </section>

        <section id="logs" class="panel">
          <div class="section-heading">
            <div><p class="eyebrow">Observability</p><h2>安全日志</h2></div>
            <div class="inline-controls">
              <button id="refresh-logs" class="button secondary" type="button">刷新</button>
              <button id="clear-logs" class="button danger-button" type="button">清空</button>
            </div>
          </div>
          <div class="form-grid">
            <label>日志级别
              <select id="observability-level">
                <option value="off">off</option>
                <option value="error">error</option>
                <option value="info">info</option>
              </select>
            </label>
            <label>KV 日志保留条数 <input id="observability-retention" type="number" min="0" max="100" required /></label>
          </div>
          <pre id="logs-output" class="output">尚未读取</pre>
        </section>

        <div class="savebar">
          <p id="message" role="status"></p>
          <button class="button primary" type="submit">保存配置</button>
        </div>
      </form>
    </main>
  </body>
</html>
